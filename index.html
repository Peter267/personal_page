    <!-- 启动进度条（原站逻辑：最短 1.2s，最长 7s，模块就绪后收尾） -->
    <script>
      (function () {
        'use strict';

        var boot = document.getElementById('boot');
        var bar = document.getElementById('boot-bar');
        var done = false;
        var progress = 0;
        var appReady = false;
        var minElapsed = false;
        var startedAt = Date.now();
        var MIN_MS = 1200;
        var MAX_MS = 7000;
        var reduceMotion = false;

        try {
          reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        } catch (e) {}

        try {
          var saved = localStorage.getItem('theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'light' || (!saved && !dark)) {
            boot.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}

        function setProgress(value) {
          progress = Math.max(progress, Math.min(100, value | 0));
          if (bar) bar.style.width = progress + '%';
          if (boot) boot.setAttribute('aria-valuenow', String(progress));
        }

        function tickFake() {
          if (done || appReady) return;
          var elapsed = Date.now() - startedAt;
          var target = Math.min(90, 8 + elapsed / 40);
          if (progress < target) {
            setProgress(Math.floor(progress + (target - progress) * 0.3));
          }
          requestAnimationFrame(tickFake);
        }

        function tryFinish() {
          if (done || !appReady || !minElapsed) return;
          done = true;
          setProgress(100);

          requestAnimationFrame(function () {
            boot.classList.add('is-done');
            setTimeout(function () {
              if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
              var styles = document.getElementById('loading-styles');
              if (styles && styles.parentNode) styles.parentNode.removeChild(styles);
            }, reduceMotion ? 0 : 650);
          });
        }

        function markAppReady() {
          if (appReady) return;
          appReady = true;
          setProgress(96);
          tryFinish();
        }

        window.__bootReady = markAppReady;

        setTimeout(function () {
          minElapsed = true;
          tryFinish();
        }, reduceMotion ? 0 : MIN_MS);

        setTimeout(function () {
          if (!appReady) markAppReady();
        }, MAX_MS);

        if (document.readyState === 'complete') {
          setProgress(28);
        } else {
          window.addEventListener(
            'load',
            function () {
              setProgress(48);
            },
            { once: true }
          );
        }

        if (!reduceMotion) requestAnimationFrame(tickFake);
        else setProgress(40);
      })();
    </script>
