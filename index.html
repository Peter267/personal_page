         ====================================================================== -->

    <style id="loading-styles">
      #boot {
        --boot-bg: #000;
        --boot-accent: #00ff88;
        --boot-accent-dim: rgba(0, 255, 136, 0.4);
        --boot-track: #1a1a1a;

        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--boot-bg);
        overflow: hidden;
      }

      #boot.light {
        --boot-bg: #f8f8f8;
        --boot-accent: #00875a;
        --boot-accent-dim: rgba(0, 135, 90, 0.4);
        --boot-track: #e0e0e0;
      }

      #boot.is-done {
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        opacity: 0;
        pointer-events: none;
      }

      .boot-brand {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--boot-accent);
        user-select: none;
      }

      .boot-logo {
        height: clamp(40px, 7vw, 56px);
        width: auto;
        aspect-ratio: 1;
        border-radius: 50%;
        display: block;
        opacity: 0;
        filter: blur(6px);
        box-shadow: 0 0 0 1px var(--boot-accent-dim), 0 0 32px -6px var(--boot-accent);
        animation: boot-reveal 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
      }

      @keyframes boot-reveal {
        to {
          opacity: 1;
          filter: blur(0);
        }
      }

      .boot-bar-wrap {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: var(--boot-track);
      }

      .boot-bar {
        height: 100%;
        width: 0%;
        background: var(--boot-accent);
        box-shadow: 0 0 16px var(--boot-accent-dim);
        transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        will-change: width;
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-logo {
          animation: none;
          opacity: 1;
          filter: none;
        }
        .boot-bar,
        #boot.is-done {
          transition: none;
        }
      }
    </style>

    <!-- 启动进度条（原站逻辑：最短 1.2s，最长 7s，模块就绪后收尾） -->
    <script>
      (function () {
        'use strict';

        var boot = document.getElementById('boot');
        var bar = document.getElementById('boot-bar');
        var done = false;
        var progress = 0;
        var appReady = false;
        var minElapsed = false;
        var startedAt = Date.now();
        var MIN_MS = 1200;
        var MAX_MS = 7000;
        var reduceMotion = false;

        try {
          reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        } catch (e) {}

        try {
          var saved = localStorage.getItem('theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'light' || (!saved && !dark)) {
            boot.classList.add('light');
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}

        function setProgress(value) {
          progress = Math.max(progress, Math.min(100, value | 0));
          if (bar) bar.style.width = progress + '%';
          if (boot) boot.setAttribute('aria-valuenow', String(progress));
        }

        function tickFake() {
          if (done || appReady) return;
          var elapsed = Date.now() - startedAt;
          var target = Math.min(90, 8 + elapsed / 40);
          if (progress < target) {
            setProgress(Math.floor(progress + (target - progress) * 0.3));
          }
          requestAnimationFrame(tickFake);
        }

        function tryFinish() {
          if (done || !appReady || !minElapsed) return;
          done = true;
          setProgress(100);

          requestAnimationFrame(function () {
            boot.classList.add('is-done');
            setTimeout(function () {
              if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
              var styles = document.getElementById('loading-styles');
              if (styles && styles.parentNode) styles.parentNode.removeChild(styles);
            }, reduceMotion ? 0 : 650);
          });
        }

        function markAppReady() {
          if (appReady) return;
          appReady = true;
          setProgress(96);
          tryFinish();
        }

        window.__bootReady = markAppReady;

        setTimeout(function () {
          minElapsed = true;
          tryFinish();
        }, reduceMotion ? 0 : MIN_MS);

        setTimeout(function () {
          if (!appReady) markAppReady();
        }, MAX_MS);

        if (document.readyState === 'complete') {
          setProgress(28);
        } else {
          window.addEventListener(
            'load',
            function () {
              setProgress(48);
            },
            { once: true }
          );
        }

        if (!reduceMotion) requestAnimationFrame(tickFake);
        else setProgress(40);
      })();
    </script>
